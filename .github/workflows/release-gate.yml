name: Unveilyx Release Gate

on:
  pull_request:
  push:
    branches: [main, develop, "release/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PHOTO_LOCAL_AUTH: "true"
      PHOTO_LOCAL_DATABASE_MODE: pglite
      NEXT_PUBLIC_APP_NAME: Unveilyx
    steps:
      - uses: actions/checkout@v4
      - name: Require committed npm lockfile
        shell: bash
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error::package-lock.json is required. Run npm run lock:refresh on an internet-connected development machine, verify it with npm run lock:verify, and commit it before deployment."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reproducible dependency install
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run release gate
        run: npm run release:gate
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
